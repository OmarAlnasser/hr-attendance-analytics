# Render Blueprint: one free web service. The database is external (Supabase PostgreSQL).
# When Render asks: HR_DATABASE_URL = the Supabase *Session pooler* URI (the password part may be
# left out), HR_DATABASE_PASSWORD = the database password on its own.
# Full walkthrough: docs/deployment.md
services:
  - type: web
    name: hr-attendance-analytics
    runtime: python
    plan: free
    region: frankfurt            # keep it close to the Supabase region (eu-central-1)
    buildCommand: pip install -r requirements.txt
    # one worker (512 MB on the free plan), threads for concurrency; the app opens a DB connection per request
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT "hr_analytics.web:create_app()"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: TZ
        value: Asia/Riyadh
      - key: HR_DATABASE_URL
        sync: false              # entered in the Render dashboard, never committed
      - key: HR_DATABASE_PASSWORD
        sync: false              # secret: only the password, kept apart from the URL
      - key: HR_SECRET_KEY
        generateValue: true
      - key: HR_DEMO_MODE
        value: "1"
      - key: HR_BEHIND_PROXY
        value: "1"
      - key: HR_SESSION_COOKIE_SECURE
        value: "1"
      - key: HR_PASSWORD_HASH_METHOD
        value: "scrypt"
